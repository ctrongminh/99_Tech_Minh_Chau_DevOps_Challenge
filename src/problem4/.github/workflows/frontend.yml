# Frontend: static SPA on S3 (+ CloudFront)
# PR -> CI only. main -> CI, build once, deploy staging, approval, deploy production.
name: frontend

on:
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Stamp version
        run: echo "{\"version\":\"$GITHUB_SHA\"}" > dist/version.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend
          path: frontend/dist
          retention-days: 30

  deploy-staging:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ vars.FRONTEND_URL }}
    concurrency:
      group: deploy-frontend-staging
    permissions:
      contents: read
      id-token: write
    env: &deploy-env
      BUCKET: ${{ vars.SITE_BUCKET }}
      DISTRIBUTION: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      URL: ${{ vars.FRONTEND_URL }}
    steps: &deploy-steps
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend
          path: dist
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Back up the live release
        # Only the small root files (index.html, version.json...). Old hashed
        # assets are never deleted, so these are enough to restore it.
        run: aws s3 sync "s3://$BUCKET" "$RUNNER_TEMP/previous" --exclude "assets/*"
      - name: Upload to S3
        run: |
          # 1. Hashed assets first, cached forever. Old ones are kept so open tabs keep working.
          aws s3 sync dist/assets "s3://$BUCKET/assets" --cache-control "public,max-age=31536000,immutable"
          # 2. index.html and the rest: always revalidated; stale files removed.
          aws s3 sync dist "s3://$BUCKET" --exclude "assets/*" --cache-control "no-cache" --delete
      - name: Invalidate CloudFront
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/*" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$id"
      - name: Smoke test
        id: smoke
        run: |
          curl -fsS "$URL/" -o /dev/null
          curl -fsS "$URL/version.json" | grep -q "$GITHUB_SHA"
      - name: Roll back if smoke test failed
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          if [ ! -f "$RUNNER_TEMP/previous/index.html" ]; then
            echo "::error::No previous release to restore (first deploy)"; exit 1
          fi
          aws s3 sync "$RUNNER_TEMP/previous" "s3://$BUCKET" --exclude "assets/*" --cache-control "no-cache" --delete
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/*" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$id"
          echo "::error::Rolled back to $(cat "$RUNNER_TEMP/previous/version.json") after a failed smoke test"
          exit 1

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: # required reviewers configured on this environment
      name: production
      url: ${{ vars.FRONTEND_URL }}
    concurrency:
      group: deploy-frontend-production
    permissions:
      contents: read
      id-token: write
    env: *deploy-env
    steps: *deploy-steps
