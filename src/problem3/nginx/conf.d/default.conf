# Docker's embedded DNS. Re-resolve "api" every 10s so that when the api
# container restarts with a new IP, nginx doesn't keep proxying to the old one.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;

    location = / {
        return 200 "Welcome to the platform\n";
    }

    location /api/ {
        # Using a variable forces nginx to resolve "api" at request time
        # (via the resolver above) instead of once at startup.
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}
